data:
  raw_dir: data/raw
  companies: [maruti, mahindra, bajaj_auto]
  years: [2023, 2024, 2025, 2026]

llm:
  provider: gemini
  model: gemini-2.5-flash       # check the docs for the current free model

embeddings:
  model: BAAI/bge-small-en-v1.5

chunking:
  chunk_size: 800               # you will tune this; note why in LEARNINGS.md
  chunk_overlap: 100

retrieval:
  k: 5
  vector_db: chroma             # switch to qdrant on Nov 29
  chroma_path: data/processed/chroma
